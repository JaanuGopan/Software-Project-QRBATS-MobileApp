name: qrbats_sp
description: "SkyTicker App is the qr-code based attendance tracking system application for students."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.3.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  lottie: ^3.1.0
  http: ^1.2.1
  flutter_barcode_scanner: ^2.0.0
  simple_barcode_scanner: ^0.1.1
  intl: ^0.19.0
  geolocator: ^7.7.0
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.1
  encrypt: ^5.0.0
  logger: ^2.5.0
  device_info_plus: 10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^3.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/logo/logo1.png
    - lib/assets/logo/logo.png
    - lib/assets/loading/loading.json
    - lib/assets/loading/loading-carga.json
    - lib/assets/loading/loading1.json
    - lib/assets/qrcode/qrcode.png
    - lib/assets/qrcode/scanning_qr.png
    - lib/assets/qrcode/barcode-scanner.png
