name: skyticker
description: "A new Flutter project."

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^3.3.2
  http: ^1.5.0
  intl: ^0.20.2
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  jwt_decoder: ^2.0.1
  encrypt: ^5.0.3
  logger: ^2.6.1
  device_info_plus: ^12.1.0
  qr_code_scanner_plus: ^2.0.10+1
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/logo/logo.png
    - lib/assets/loading/loading.json
    - lib/assets/loading/loading-carga.json
    - lib/assets/loading/loading1.json
    - lib/assets/qrcode/qrcode.png
    - lib/assets/qrcode/scanning_qr.png
    - lib/assets/qrcode/barcode-scanner.png
